name: Terraform dev

# Aplica la infraestructura (alarmas, dashboard, IAM, ALB, etc.) del entorno dev.
# El deploy de la imagen ECS lo hace deploy-dev.yml; aqui solo se gestiona el IaC.
# El servicio ECS tiene ignore_changes=[task_definition], por lo que un apply
# no revierte la imagen desplegada por deploy-dev.yml.
#
# Los *.tfvars estan gitignored (guardan secretos), por lo que la config del
# backend se pasa inline y las variables via TF_VAR_* (no-secretas abajo en env,
# secretas desde GitHub Secrets: DB_PASSWORD, MQ_PASSWORD, ALB_SECRET_TOKEN,
# CLOUDFRONT_SECRET_HEADER).
on:
  push:
    branches:
      - develop
    paths:
      - 'iac/**'
      - '.github/workflows/terraform-dev.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Accion a ejecutar'
        type: choice
        default: apply
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: iac/environments/dev
  # Backend de estado (no secreto)
  TF_STATE_BUCKET: tesla-bootstrap-terraform-state-050608055215
  TF_STATE_KEY: dev/terraform.tfstate
  TF_LOCKS_TABLE: tesla-bootstrap-terraform-locks

# Serializa las corridas para evitar applies concurrentes sobre el mismo estado.
concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform dev
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    env:
      # Variables NO secretas (deben coincidir con el estado desplegado)
      TF_VAR_project_name: tesla-backend
      TF_VAR_environment: dev
      TF_VAR_aws_region: us-east-1
      TF_VAR_prefix: tesla-backend-dev
      TF_VAR_db_username: tesla_backend_user
      TF_VAR_mq_username: tesla_mq_user
      TF_VAR_cache_retention_days: "1"
      TF_VAR_allowed_callback_urls: '["http://localhost:5173","https://tesla-frontend-dev.vercel.app/callback","https://d13yx46la9i1ou.cloudfront.net/callback"]'
      # Variables secretas (desde GitHub Secrets)
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_mq_password: ${{ secrets.MQ_PASSWORD }}
      TF_VAR_alb_secret_token: ${{ secrets.ALB_SECRET_TOKEN }}
      TF_VAR_cloudfront_secret_header: ${{ secrets.CLOUDFRONT_SECRET_HEADER }}

    steps:
      - name: checkout del codigo
        uses: actions/checkout@v6

      - name: autenticacion oidc con aws
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: instalar terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: formato
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCKS_TABLE}" \
            -backend-config="encrypt=true"

      - name: validate
        run: terraform validate

      - name: plan
        run: terraform plan -input=false -out=tfplan

      - name: apply
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: terraform apply -input=false tfplan
