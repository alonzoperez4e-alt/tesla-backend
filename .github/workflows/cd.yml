name: CD

# Pipeline de entrega continua por entorno segun la rama:
#   develop -> dev, main -> prod.
#
# Orden garantizado en una sola corrida:
#   setup (resuelve entorno + detecta cambios en iac/)
#     -> activar (enciende RDS y ECS si el despliegue cae fuera de horario)
#       -> terraform (aplica infra; solo si iac/** cambio o dispatch manual)
#         -> deploy   (construye la imagen y la despliega en ECS)
#
# deploy depende de terraform (needs), asi la infra se crea/actualiza ANTES
# del despliegue. En la primera promocion a un entorno nuevo, terraform crea
# el cluster/servicio ECS y luego deploy publica la imagen real, sin pasos
# manuales; por eso 'activar' no falla cuando todavia no hay nada que encender.
# El servicio ECS tiene ignore_changes=[task_definition], por lo que un apply
# posterior no revierte la imagen desplegada.
on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Accion de Terraform (deploy solo corre en apply)'
        type: choice
        default: apply
        options:
          - plan
          - apply

# Los permisos se declaran job por job, no aqui: un bloque a nivel de workflow se
# aplica tambien a los jobs que no lo necesitan. activar, terraform y deploy suman
# id-token: write para el OIDC con AWS.

# Serializa por entorno; dev y prod no se bloquean entre si.
concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  setup:
    name: Resolver entorno y cambios
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      env: ${{ steps.map.outputs.env }}
      iac_changed: ${{ steps.detect.outputs.iac_changed }}
    steps:
      - name: mapear rama a entorno
        id: map
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            develop) echo "env=dev"  >> "$GITHUB_OUTPUT" ;;
            main)    echo "env=prod" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Rama no mapeada a ningun entorno: $REF_NAME"; exit 1 ;;
          esac

      - name: checkout del codigo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: detectar cambios en iac/
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" != "push" ] \
             || [ -z "$BEFORE_SHA" ] \
             || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse "$BEFORE_SHA" >/dev/null 2>&1; then
            # dispatch manual o primer push sin base: aplicar infra por seguridad
            echo "iac_changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" | grep -qE '^iac/'; then
            echo "iac_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "iac_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # El backend solo esta encendido de 18:00 a 24:00 (hora de Lima). Un despliegue
  # fuera de esa franja encontraria el servicio en 0 tareas y la instancia RDS
  # parada, lo que rompe dos cosas:
  #   - Un 'terraform apply' que modifique la instancia RDS falla si esta detenida.
  #   - Con 0 tareas el waiter 'servicesStable' termina al instante y la
  #     verificacion de rollback del final del job 'deploy' daria verde sin haber
  #     comprobado que la imagen nueva arranca, anulando el circuit breaker.
  # Por eso se enciende todo antes de desplegar. El cierre programado de esa misma
  # noche devuelve el servicio a 0; el coste de las horas extra es despreciable.
  #
  # Los dos pasos toleran que los recursos aun no existan: en la primera promocion a
  # un entorno nuevo es 'terraform' quien los crea, y hacer fallar este job dejaria
  # el entorno sin poder crearse nunca.
  #
  # No corre en un dispatch de solo 'plan': 'terraform plan' lee sin problema una
  # instancia detenida, encenderla no aportaria nada.
  activar:
    name: Activar entorno ${{ needs.setup.outputs.env }}
    needs: setup
    if: github.event_name == 'push' || github.event.inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.env }}
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      # Mismo identificador que construye iac/modules/database/bd.tf a partir de
      # project_name (fijado a 'tesla-backend') y el entorno.
      DB_INSTANCE_ID: tesla-backend-${{ needs.setup.outputs.env }}-db

    steps:
      - name: autenticacion oidc con aws
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: arrancar la instancia rds si esta parada
        run: |
          # El '|| echo' captura DBInstanceNotFound sin disparar 'set -e': dentro de
          # una sustitucion de comando el fallo se absorbe en el valor.
          ESTADO=$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_INSTANCE_ID" \
            --query "DBInstances[0].DBInstanceStatus" --output text 2>/dev/null \
            || echo NO_EXISTE)

          if [ "$ESTADO" = "NO_EXISTE" ]; then
            echo "La instancia $DB_INSTANCE_ID aun no existe; la creara terraform."
            exit 0
          fi

          echo "Estado actual de $DB_INSTANCE_ID: $ESTADO"

          if [ "$ESTADO" = "stopped" ]; then
            aws rds start-db-instance --db-instance-identifier "$DB_INSTANCE_ID" >/dev/null
            echo "Arranque solicitado."
          fi

          # Espera tambien si la instancia estaba a medio arrancar (starting,
          # modifying, ...): el deploy necesita que este 'available'.
          aws rds wait db-instance-available --db-instance-identifier "$DB_INSTANCE_ID"
          echo "La base de datos esta disponible."

      - name: escalar el servicio ecs a una tarea
        run: |
          # Cubre los dos casos de un entorno a medio crear: si falta el cluster el
          # comando falla, y si solo falta el servicio devuelve 'None'.
          ESTADO=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query "services[0].status" --output text 2>/dev/null \
            || echo NO_EXISTE)

          if [ "$ESTADO" != "ACTIVE" ]; then
            echo "El servicio $ECS_SERVICE aun no esta activo ($ESTADO); lo creara terraform."
            exit 0
          fi

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --desired-count 1 >/dev/null
          echo "Servicio $ECS_SERVICE escalado a 1 tarea."

  terraform:
    name: Terraform ${{ needs.setup.outputs.env }}
    needs: [setup, activar]
    # 'always()' porque en un dispatch de solo 'plan' el job 'activar' se salta, y un
    # 'needs' saltado arrastraria a este sin el. Lo que no se tolera es que 'activar'
    # haya fallado de verdad.
    if: >-
      always()
      && needs.setup.result == 'success'
      && needs.activar.result != 'failure'
      && needs.activar.result != 'cancelled'
      && (needs.setup.outputs.iac_changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.env }}
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: iac/environments/${{ needs.setup.outputs.env }}

    env:
      AWS_REGION: us-east-1
      # Backend de estado (bucket y tabla compartidos; key por entorno)
      TF_STATE_BUCKET: tesla-bootstrap-terraform-state-050608055215
      TF_STATE_KEY: ${{ needs.setup.outputs.env }}/terraform.tfstate
      TF_LOCKS_TABLE: tesla-bootstrap-terraform-locks
      # Variables NO secretas derivadas del entorno
      TF_VAR_project_name: tesla-backend
      TF_VAR_aws_region: us-east-1
      TF_VAR_environment: ${{ needs.setup.outputs.env }}
      TF_VAR_prefix: tesla-backend-${{ needs.setup.outputs.env }}
      # Variables NO secretas especificas del entorno (GitHub Environment vars)
      TF_VAR_db_username: ${{ vars.DB_USERNAME }}
      TF_VAR_allowed_callback_urls: ${{ vars.ALLOWED_CALLBACK_URLS }}
      # Variables secretas (Environment secrets, con fallback a repo secrets)
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      # La variable de Terraform se renombro al retirar el ALB; el secreto en
      # GitHub sigue llamandose ALB_SECRET_TOKEN para no tener que recrearlo.
      TF_VAR_origin_secret_token: ${{ secrets.ALB_SECRET_TOKEN }}

    steps:
      - name: checkout del codigo
        uses: actions/checkout@v6

      - name: autenticacion oidc con aws
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: instalar terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: formato
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCKS_TABLE}" \
            -backend-config="encrypt=true"

      - name: validate
        run: terraform validate

      - name: plan
        run: terraform plan -input=false -out=tfplan

      - name: apply
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: terraform apply -input=false tfplan

  deploy:
    name: Deploy ${{ needs.setup.outputs.env }}
    needs: [setup, activar, terraform]
    # Corre tras terraform (o si este se salto por no haber cambios de infra),
    # pero no si terraform fallo/cancelo, ni en un dispatch de solo 'plan'.
    # 'activar' si es obligatorio: sin el, el servicio podria estar en 0 tareas y
    # el despliegue no validaria nada.
    if: >-
      always()
      && needs.setup.result == 'success'
      && needs.activar.result == 'success'
      && needs.terraform.result != 'failure'
      && needs.terraform.result != 'cancelled'
      && (github.event_name == 'push' || github.event.inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.env }}
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      TASK_FAMILY: ${{ vars.TASK_FAMILY }}

    steps:
      - name: checkout del codigo
        uses: actions/checkout@v6

      - name: autenticacion oidc con aws
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: login en aws ecr
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: construir, etiquetar y pushear imagen a ecr
        id: build-imagen
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: descargar la definicion de tarea actual desde ecs
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query taskDefinition > task-definition.json

      - name: inyectar la nueva imagen en la definicion
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: ${{ steps.build-imagen.outputs.image }}

      - name: desplegar nueva version en aws ecs
        id: desplegar
        uses: aws-actions/amazon-ecs-deploy-task-definition@69e7aed9b8acdd75a6c585ac669c33831ab1b9a3 # v1
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          wait-for-service-stability: true

      # El paso anterior solo espera al waiter 'servicesStable'. Con el circuit
      # breaker activo, un despliegue fallido revierte a la revision anterior y
      # el servicio vuelve a estar estable, asi que el waiter termina OK y el job
      # se pondria en verde sin haber publicado la imagen nueva. Se comprueba de
      # forma explicita que el deployment PRIMARY es el que acabamos de registrar.
      - name: verificar que no hubo rollback
        env:
          ESPERADA: ${{ steps.desplegar.outputs.task-definition-arn }}
        run: |
          ACTIVA=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query "services[0].deployments[?status=='PRIMARY'].taskDefinition | [0]" \
            --output text)

          if [ "$ACTIVA" != "$ESPERADA" ]; then
            echo "::error::El servicio revirtio al circuit breaker."
            echo "  esperada: $ESPERADA"
            echo "  activa:   $ACTIVA"
            echo "Revisa los logs de la tarea en CloudWatch para ver por que no arranco."
            exit 1
          fi

          echo "Desplegada y estable: $ACTIVA"
