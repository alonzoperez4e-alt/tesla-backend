name: Deploy ECS dev
on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  TASK_FAMILY: ${{ vars.TASK_FAMILY }}

jobs:

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: dev

    # La calidad (tests, cobertura y SonarCloud) se valida en ci.yml sobre el PR.
    # Este workflow solo construye la imagen y la despliega. Proteger la rama
    # 'develop' exigiendo el check de CI antes de mergear.
    steps:
      - name: checkout del codigo
        uses: actions/checkout@v6

      - name: autenticacion oidc con aws
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: login en aws ecr
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: construir, etiquetar y pushear imagen a ecr
        id: build-imagen
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: descargar la definicion de tarea actual desde ecs
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.TASK_FAMILY }} --query taskDefinition > task-definition.json

      - name: inyectar la nueva imagen en la definicion
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: ${{ steps.build-imagen.outputs.image }}
          # DB_PASSWORD y MQ_PASSWORD ya no se inyectan aqui: la task definition
          # los resuelve desde SSM Parameter Store (SecureString) via el bloque
          # `secrets`, definido en Terraform (modules/compute).

      - name: desplegar nueva version en aws ecs
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          wait-for-service-stability: true
