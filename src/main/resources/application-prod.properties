# Base de datos: Amazon RDS PostgreSQL (endpoint inyectado en DB_URL por Terraform)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP - Connection Pool
spring.datasource.hikari.pool-name=TeslaHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.idle-timeout=300000

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Seguridad
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.devtools.restart.enabled=false

# Sin valor por defecto a proposito: si ORIGIN_TOKEN no se inyecta, la aplicacion
# no arranca. Preferible a quedarse sin la unica validacion que impide alcanzar
# el backend saltandose CloudFront por la URL execute-api.
app.security.origin-token=${ORIGIN_TOKEN}

# Actuator: exponer solo health e info por web (evita env/heapdump/etc.)
management.endpoints.web.exposure.include=health,info

# Metricas de aplicacion -> CloudWatch (push via Micrometer). NO expone ningun
# endpoint web: la exportacion es por push. La allow-list de MetricsConfig limita
# las series publicadas para acotar el costo (cada metrica custom se factura).
management.cloudwatch.metrics.export.enabled=true
management.cloudwatch.metrics.export.namespace=Tesla/Backend-prod
management.cloudwatch.metrics.export.step=1m
management.cloudwatch.metrics.export.batch-size=20

# Logs limpios
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# Logs estructurados en JSON (Elastic Common Schema) hacia stdout -> CloudWatch.
# Permite consultar por nivel/campos en Logs Insights sin parsear texto plano.
logging.structured.format.console=ecs