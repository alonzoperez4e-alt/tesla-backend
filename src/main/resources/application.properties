server.tomcat.basedir=/tmp/tomcat

spring.application.name=teslabackend

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Spring Boot Multipart File Configuration (Maximo 10MB por archivo)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# seguridad
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}

# Token compartido que CloudFront inyecta como X-Tesla-Origin-Token y valida
# OriginTokenFilter. Vacio por defecto = filtro desactivado, para poder levantar
# la app en local. El perfil prod lo redeclara SIN valor por defecto para que la
# ausencia de ORIGIN_TOKEN impida arrancar en lugar de degradar la seguridad.
app.security.origin-token=${ORIGIN_TOKEN:}

# AWS (compartido por S3 y Cognito Admin API)
aws.region=${AWS_REGION:us-east-1}
aws.cognito.user-pool-id=${COGNITO_USER_POOL_ID}

# S3. Va en la configuracion comun (no por perfil): S3StorageService lee estas
# cuatro propiedades con @Value sin valor por defecto, asi que si faltan en algun
# perfil la aplicacion no llega a arrancar.
aws.s3.bucket-name=${S3_IMAGE_BUCKET_NAME}
aws.s3.public-base-url=${CDN_PUBLIC_BASE_URL}
aws.s3.presigned-url-duration-minutes=10
aws.s3.allowed-content-types=image/jpeg,image/png,image/webp

# Health checks diferenciados (Actuator):
#  - liveness  (/actuator/health/liveness): salud del proceso -> usado por Docker
#    para reiniciar el contenedor solo si la app esta rota (no si falla una dep).
#  - readiness (/actuator/health/readiness): incluye la BD, la unica dependencia
#    externa critica que queda tras retirar Redis y Amazon MQ.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db