# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/tesla_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# Logs muy detallados
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# En local no se publican metricas a CloudWatch (Micrometer usa el registry
# 'simple' en memoria). MetricsConfig es @Profile("prod"), pero se deshabilita
# el export aqui de forma explicita para evitar cualquier intento de push.
management.cloudwatch.metrics.export.enabled=false

# S3
aws.s3.bucket-name=${S3_IMAGE_BUCKET_NAME}
aws.s3.public-base-url=${CDN_PUBLIC_BASE_URL}
aws.s3.presigned-url-duration-minutes=10
aws.s3.allowed-content-types=image/jpeg,image/png,image/webp

# Redis (local)
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

# MQ
spring.rabbitmq.host=${MQ_HOST:localhost}
spring.rabbitmq.port=${MQ_PORT:61613}
spring.rabbitmq.username=${MQ_USERNAME:guest}
spring.rabbitmq.password=${MQ_PASSWORD:guest}