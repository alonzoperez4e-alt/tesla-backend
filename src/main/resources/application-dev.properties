# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/tesla_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# Logs muy detallados
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# En local no se publican metricas a CloudWatch (Micrometer usa el registry
# 'simple' en memoria). MetricsConfig es @Profile("prod"), pero se deshabilita
# el export aqui de forma explicita para evitar cualquier intento de push.
management.cloudwatch.metrics.export.enabled=false